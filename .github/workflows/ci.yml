name: studio-ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  studio-gate:
    name: studio-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install test dependencies
        shell: bash
        run: python3 -m pip install --quiet 'pytest==8.3.4' 'PyYAML==6.0.2'
      - name: Repository gate
        shell: bash
        run: bash scripts/check_repo_gate.sh

  console-tests:
    name: console-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        working-directory: backend
        shell: bash
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -e '.[dev]'
          python -m pip install --quiet -e ../packages/jcheng_core --no-deps
      - name: Backend tests
        working-directory: backend
        shell: bash
        run: python -m pytest tests -q

  frontend-build:
    name: frontend-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        shell: bash
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        shell: bash
        run: npm run build
