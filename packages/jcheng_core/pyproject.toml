[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jcheng-core"
version = "0.1.0"
description = "Shared pure-Python statistics and point-cloud primitives"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[tool.setuptools]
packages = ["jcheng_stats", "jcheng_vision"]
