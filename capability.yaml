# Capability manifest for the organization's admission check.
# jcheng-studio is an L4 operator application: the ArmPi Debug Studio console
# and its backend (JCHENG-Robotics/.github docs/repo-taxonomy.md, layer L4).
#
# v0.2.0 ports the console backend and UI, but still has no ROS runtime
# surface: no DDS domain, topic, service or device. The ported legacy HTTP
# gateway adapter is not a ROS interface and is disabled by default. The empty
# runtime surface is deliberate: the console must not claim a transport it
# does not serve.
#
# The permanent division of authority is already fixed: the Studio talks to the
# system gateways over HTTP/WS only, forwards operator *intent*, and never
# holds a control lease itself. The system layer owns the lease, deadman,
# limits, stop latch and the single motion entry point. M1 adds the /v1 gateway
# client and this file gains no ROS runtime surface even then; only contract
# and system_api ranges matter.
schema_version: 1
name: jcheng-studio
version: 0.2.0
contract:
  interfaces: ">=0.1,<0.2"
  contract_hash: "sha256:0b8d72ced7f54d444d6851d8b99a51a78e2bed3f687324f51a15f76557f24b42"
  system_api: ">=0.1,<0.2"
safety:
  class: offline
  scopes: []
  # Required by capability-manifest.v1.schema.json. It is vacuous because the
  # Studio never becomes a lease holder; the system layer owns every lease.
  requires_lease: true
  max_rate_hz: 1
  deadman_ms: 500
hardware_access: none
runtime:
  ros_domains: []
  publishes: []
  subscribes: []
